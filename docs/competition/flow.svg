<text x="420.0" y="1042.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1C2430">处理结果录入 → 预回复 / 回访话术</text>
<text x="420.0" y="1060.0" text-anchor="middle" font-size="10.5" fill="#66707C">人工确认后使用 · 不自动发送</text>
